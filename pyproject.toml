[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-quality-decision-ai"
version = "0.1.0"
description = "Detect physical objects (oriented boxes) and decide GOOD/BAD from photos and video, with an uncertainty-gated reference-bank harness. First domain: weld."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Physical Quality Decision AI contributors" }]
keywords = ["quality inspection", "computer vision", "oriented object detection", "weld", "pytorch"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scipy>=1.11",
  "shapely>=2.0",
  "ensemble-boxes>=1.0.9",
  "safetensors>=0.4",
  "pillow>=10.0",
  "tqdm",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = ["pytest", "ruff"]

[project.scripts]
pqdai = "pqdai.cli:main"

[project.entry-points."pqdai.domains"]
# third-party packages can expose a callable returning a pqdai.domains.DomainSpec here

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pqdai.domains.weld" = ["reference_bank/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741", "E731"]
